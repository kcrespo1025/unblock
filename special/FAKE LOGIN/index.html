        box-shadow: 0px 4px 0px 0px #3062B3 !important;
        -webkit-box-shadow: 0px 4px 0px 0px #3062B3 !important;

  <body class="login-bg">

      <div class="navbar navbar-default navbar-fixed-top2 text-center">
        <div style="min-height:34px; padding:2px;background:#b09043;">
          <span style="display:inline-block; margin-right:5px;"></span>
        </div>
      </div>

      <div class="container login" id="login_form_action">
        <div class="container1">

            <div id='container-watermark' style="opacity:1.0; background-position: top right; margin: 0 auto;"></div>

            <div class="heading" style="margin-top: 20px;">
              &nbsp;
            </div>
            <div class="row">
              <div class="col-xs-12">

                <form onsubmit="return false;">
                  <div class="form-group username-container">
                    <input type="text" autocomplete="off" id="username" class="form-control" placeholder=" " aria-label="Username">
                    <span class="floating-label">Username</span>
                  </div>

                  <div class="form-group password-row-container">
                    <div class="form-group password-field password-container">
                      <input type="password" autocomplete="off" class="form-control hideShowPassword-hidden" placeholder=" " id="password" autocapitalize="none" spellcheck="false" aria-label="Password">
                      <span class="floating-label">Password</span>
                    </div>
                  </div>

                  <button type="button" id="signin" name="signin" class="btn btn-primary btn-block btnlogin" aria-label="Sign In">Sign In</button>
                </form>

                <button title="Sign in with Google " class="btn btn-primary btn-block google" type="button">
                  <img src="cdn.classlink.com/production/framework/assets/images/lp-login/btn_google.png" alt="" />
                  <span>Sign in with Google</span>
                </button>

              </div>
              <div style="text-align: center;">
                <h2 class="sign-in-services">Or sign in using:</h2>
              </div>

              <div class="social-link">
                <a href="#" onclick="return false;" class="qrcode" id="login_qrcodelink" title=" Sign in with Quickcard" aria-label="Sign in with your quick card"><i class="default fa icon-qrcode-logins"></i><i class="hover fa icon-qrcode-logins-hover"></i><span class="sr-only">Sign in with Quickcard</span></a>
              </div>

            </div>
        </div>
      </div>

      <script type="text/javascript">
        window.onpageshow = function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        };
        document.getElementById('signin').addEventListener('click', function() {
            this.innerHTML = 'Please wait';
            this.disabled = true;
            setTimeout(function() {
                var btn = document.getElementById('signin');
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            }, 1500);
        });
      </script>
